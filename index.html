<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Duo截图">
<meta name="theme-color" content="#0b0b0d">
<title>iPhone Duo 截图</title>
<style>
/* Layout: preview on top / controls below on phones; two columns on wide screens */
:root {
  --bg: #f2f2f4; --panel: #ffffff; --fg: #141416; --muted: #6b6b73;
  --line: #dcdce2; --accent: #2f6bff; --accent-fg: #ffffff; --stage: #e4e4ea; --ok: #1f9d55;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Noto Sans SC", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0b0d; --panel: #17171a; --fg: #f2f2f5; --muted: #8e8e97;
  --line: #2a2a30; --accent: #5b8bff; --accent-fg: #ffffff; --stage: #121215; --ok: #3ccf7a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b0b0d; --panel: #17171a; --fg: #f2f2f5; --muted: #8e8e97;
  --line: #2a2a30; --accent: #5b8bff; --accent-fg: #ffffff; --stage: #121215; --ok: #3ccf7a; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--font); }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); font-size: 13px; margin: 4px 0 16px; }
.grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 800px) { .grid { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; } }
.stage { background: var(--stage); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
.stage img { display: block; max-width: 100%; max-height: 72vh; border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.tag { font-size: 12px; color: var(--muted); text-align: center; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.row { display: flex; flex-direction: column; gap: 8px; }
.lbl { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.lbl b { font-weight: 500; color: var(--fg); font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { flex: 1; padding: 9px 4px; border: 0; background: transparent; color: var(--fg); font: 500 14px var(--font); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.time { display: flex; align-items: center; gap: 8px; }
.time input, .num { font: 600 20px var(--mono); padding: 10px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
.time .colon { font: 700 22px var(--mono); color: var(--fg); }
.batt { display: flex; align-items: center; gap: 12px; }
.batt input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
.num { width: 72px; font-size: 18px; }
.toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tg { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; cursor: pointer; }
.tg input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border-radius: 12px; font: 600 16px var(--font); border: 0; cursor: pointer; width: 100%; }
.btn.primary { background: var(--accent); color: var(--accent-fg); }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); padding: 11px; font-size: 15px; }
.btn:focus-visible, .seg button:focus-visible, input:focus-visible, .tg:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.detect { font-size: 13px; color: var(--muted); margin: 0; min-height: 1.2em; }
.detect.ok { color: var(--ok); }
.msg { font-size: 13px; color: var(--muted); min-height: 1.2em; margin: 0; }
[hidden] { display: none !important; }
.file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; font-size: 14px; }
  img { max-width: 100%; }
</style>
</head>
<body>

<div class="wrap">
  <h1>iPhone Duo 截图</h1>
  <p class="sub">普通 iPhone 截图 → 侧边状态栏的 Duo 样式（合上 / 打开）。时间和电量自动从截图读取，图片只在本机处理。</p>

  <div class="grid">
    <section class="stage">
      <img id="result" alt="转换后的截图预览">
      <span class="tag" id="srcTag">示例截图 · 选一张你的截图替换</span>
    </section>

    <section class="panel">
      <input type="file" id="file" class="file" accept="image/*">
      <input type="file" id="file2" class="file" accept="image/*">
      <button class="btn primary" id="pick" type="button">选择截图</button>
      <p class="detect" id="detect"></p>

      <div class="row">
        <span class="lbl">形态</span>
        <div class="seg" id="mode" role="group" aria-label="形态">
          <button type="button" data-v="fold" aria-pressed="true">合上（外屏）</button>
          <button type="button" data-v="open" aria-pressed="false">打开（内屏）</button>
        </div>
      </div>

      <div class="row" id="layoutRow" hidden>
        <span class="lbl">打开后的布局</span>
        <div class="seg" id="layout" role="group" aria-label="打开后的布局">
          <button type="button" data-v="side" aria-pressed="true">侧栏</button>
          <button type="button" data-v="center" aria-pressed="false">居中</button>
          <button type="button" data-v="split" aria-pressed="false">分屏</button>
        </div>
        <button class="btn ghost" id="pick2" type="button" hidden>选右边那张截图</button>
      </div>

      <div class="row">
        <span class="lbl">时间</span>
        <div class="time">
          <input id="hh" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="11" aria-label="小时" autocomplete="off">
          <span class="colon">:</span>
          <input id="mm" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="04" aria-label="分钟" autocomplete="off">
        </div>
      </div>

      <div class="row">
        <span class="lbl">电量</span>
        <div class="batt">
          <input type="range" id="battery" min="0" max="100" value="45" aria-label="电量滑块">
          <input type="text" id="batteryNum" class="num" inputmode="numeric" pattern="[0-9]*" maxlength="3" value="45" aria-label="电量百分比">
        </div>
        <div class="toggles">
          <label class="tg">充电中 <input type="checkbox" id="charging"></label>
          <label class="tg">低电量模式 <input type="checkbox" id="lowPower"></label>
        </div>
      </div>

      <div class="row">
        <span class="lbl">信号点（亮几个）</span>
        <div class="seg" id="signal" role="group" aria-label="信号点">
          <button type="button" data-v="0" aria-pressed="true">0</button>
          <button type="button" data-v="1" aria-pressed="false">1</button>
          <button type="button" data-v="2" aria-pressed="false">2</button>
          <button type="button" data-v="3" aria-pressed="false">3</button>
          <button type="button" data-v="4" aria-pressed="false">4</button>
        </div>
      </div>

      <div class="row">
        <span class="lbl">侧边栏元素</span>
        <div class="toggles">
          <label class="tg">灵动岛 <input type="checkbox" id="island" checked></label>
          <label class="tg">返回键 <input type="checkbox" id="back"></label>
        </div>
      </div>

      <div class="row">
        <span class="lbl">原图顶部状态栏</span>
        <div class="seg" id="crop" role="group" aria-label="状态栏裁剪">
          <button type="button" data-v="1" aria-pressed="true">自动裁掉</button>
          <button type="button" data-v="0" aria-pressed="false">保留</button>
        </div>
      </div>

      <button class="btn primary" id="save" type="button">保存图片</button>
      <p class="msg" id="msg">也可以直接长按预览图保存</p>
    </section>
  </div>
</div>

<script>
const Duo = (() => {
  // All sizes in u = screen height / 100, measured from official iPhone Duo screenshots.
  const L = {
    FOLD: 0.689, OPEN: 1.41,              // outer / inner display aspect (w/h)
    STRIP: 11.9, CX: 5.3, CORNER: 5.0,    // side status column width, its center, window corner radius
    ISL_TOP: 3.3, ISL_H: 10.3, ISL_W: 6.2,
    CAM_TOP: 4.6, CAM: 3.4, CAM_R: 0.9,
    GRILL_Y: 10.4, GRILL_GAP: 0.56, GRILL_R: 0.16,
    TIME_Y_ISL: 17.9, TIME_Y: 5.9, FONT: 2.45,
    RING_DY: 5.9, RING_R: 2.82, RING_W: 0.46, GAP: 63,
    DOT_R: 2.7, DOT: 0.24,
    WIFI_DY: 0.62, WIFI_R: 1.84,
    BACK_DY: 11.2, BACK_R: 3.5,
    SPLIT_GAP: 1.0
  };

  // ---------- source status bar height ----------
  const SB = { "1179x2556": 177, "1290x2796": 177, "1206x2622": 186, "1320x2868": 186, "1260x2736": 186,
    "1170x2532": 141, "1284x2778": 141, "1125x2436": 132, "1242x2688": 132, "828x1792": 96,
    "1080x2340": 150, "750x1334": 40, "1242x2208": 60, "640x1136": 40 };
  const sizeOf = (img) => [img.naturalWidth || img.width, img.naturalHeight || img.height];
  function statusBarPx(img) {
    const [w, h] = sizeOf(img);
    return SB[w + "x" + h] ?? Math.round(h * 0.069);
  }

  // ---------- glyph recognition (template matching against system fonts) ----------
  const GW = 12, GH = 18;
  let templates = null;
  function vecFrom(test, x0, y0, x1, y1) {
    const w = x1 - x0 + 1, h = y1 - y0 + 1, v = new Float32Array(GW * GH);
    for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++) {
      let s = 0;
      for (let sy = 0; sy < 3; sy++) for (let sx = 0; sx < 3; sx++) {
        const px = x0 + Math.min(w - 1, Math.floor((gx + (sx + 0.5) / 3) * w / GW));
        const py = y0 + Math.min(h - 1, Math.floor((gy + (sy + 0.5) / 3) * h / GH));
        if (test(px, py)) s++;
      }
      v[gy * GW + gx] = s / 9;
    }
    let m = 0; for (const a of v) m += a; m /= v.length;
    let n = 0; for (let i = 0; i < v.length; i++) { v[i] -= m; n += v[i] * v[i]; }
    n = Math.sqrt(n) || 1; for (let i = 0; i < v.length; i++) v[i] /= n;
    return v;
  }
  function inkBox(test, w, h) {
    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (test(x, y)) {
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
    return x1 < 0 ? null : { x0, y0, x1, y1 };
  }
  function buildTemplates() {
    templates = [];
    const S = 160, c = document.createElement("canvas"); c.width = c.height = S;
    const g = c.getContext("2d", { willReadFrequently: true });
    const fonts = [
      '600 110px -apple-system, system-ui, sans-serif',
      '700 110px -apple-system, system-ui, sans-serif',
      '700 110px ui-rounded, "SF Pro Rounded", -apple-system, sans-serif',
      '800 110px ui-rounded, "SF Pro Rounded", -apple-system, sans-serif',
      'bold 110px "Helvetica Neue", Helvetica, Arial, sans-serif',
      'bold 110px "Liberation Sans", "DejaVu Sans", Roboto, Arial, sans-serif',
      '600 110px Inter, Roboto, "Segoe UI", Arial, sans-serif'
    ];
    const add = (ch) => {
      const d = g.getImageData(0, 0, S, S).data;
      const t = (x, y) => d[(y * S + x) * 4 + 3] > 110;
      const b = inkBox(t, S, S); if (!b) return;
      templates.push({ ch, vec: vecFrom(t, b.x0, b.y0, b.x1, b.y1), aspect: (b.x1 - b.x0 + 1) / (b.y1 - b.y0 + 1) });
    };
    g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = "#000";
    for (const f of fonts) for (const ch of "0123456789") {
      g.clearRect(0, 0, S, S); g.font = f; g.fillText(ch, S / 2, S / 2); add(ch);
    }
    // charging bolt shapes, so they can be told apart from digits
    for (const pts of [
      [[.70,0],[.05,.56],[.47,.56],[.30,1],[.95,.42],[.53,.42]],
      [[.62,0],[.10,.60],[.44,.60],[.36,1],[.90,.40],[.56,.40]]]) {
      g.clearRect(0, 0, S, S); g.beginPath();
      pts.forEach(([x, y], i) => { const X = 50 + x * 60, Y = 25 + y * 110; i ? g.lineTo(X, Y) : g.moveTo(X, Y); });
      g.closePath(); g.fill(); add("bolt");
    }
  }
  function classify(vec, aspect) {
    if (!templates) buildTemplates();
    let best = { ch: null, score: -2 };
    for (const t of templates) {
      let s = 0; for (let i = 0; i < vec.length; i++) s += vec[i] * t.vec[i];
      s -= 0.35 * Math.abs(Math.log(aspect / t.aspect));
      if (s > best.score) best = { ch: t.ch, score: s };
    }
    return best;
  }

  // connected components on a 0/1 mask
  function components(mask, w, h) {
    const lab = new Int32Array(w * h), comps = [], stack = [];
    let id = 0;
    for (let i = 0; i < w * h; i++) {
      if (!mask[i] || lab[i]) continue;
      id++; const c = { id, x0: w, y0: h, x1: -1, y1: -1, n: 0 };
      lab[i] = id; stack.push(i);
      while (stack.length) {
        const p = stack.pop(), x = p % w, y = (p - x) / w;
        c.n++; if (x < c.x0) c.x0 = x; if (x > c.x1) c.x1 = x; if (y < c.y0) c.y0 = y; if (y > c.y1) c.y1 = y;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          const q = ny * w + nx;
          if (mask[q] && !lab[q]) { lab[q] = id; stack.push(q); }
        }
      }
      c.w = c.x1 - c.x0 + 1; c.h = c.y1 - c.y0 + 1; comps.push(c);
    }
    return { lab, comps };
  }
  const lumOf = (d, i) => 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
  const satOf = (d, i) => Math.max(d[i], d[i + 1], d[i + 2]) - Math.min(d[i], d[i + 1], d[i + 2]);
  function median(arr) { const a = Array.from(arr).sort((p, q) => p - q); return a[a.length >> 1] || 0; }

  function readGlyphs(lab, w, list) {
    return list.map((c) => {
      const v = vecFrom((x, y) => lab[y * w + x] === c.id, c.x0, c.y0, c.x1, c.y1);
      return classify(v, c.w / c.h);
    });
  }

  function readTime(d, W, sb, x0, x1) {
    const w = x1 - x0, h = sb, lum = new Float32Array(w * h), samp = [];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const v = lumOf(d, (y * W + x0 + x) * 4); lum[y * w + x] = v;
      if ((x + y) % 5 === 0) samp.push(v);
    }
    const med = median(samp), dark = med < 128;
    const thr = dark ? Math.max(150, med + 70) : Math.min(110, med - 70);
    const mask = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) mask[i] = dark ? lum[i] > thr : lum[i] < thr;
    const { lab, comps } = components(mask, w, h);
    const cand = comps.filter((c) => c.h >= 0.11 * h && c.h <= 0.55 * h && c.w <= 1.2 * c.h && c.n >= 0.12 * c.w * c.h);
    let best = [];
    for (const a of cand) {
      const grp = cand.filter((b) => Math.abs(b.y1 - a.y1) <= 0.18 * a.h && Math.abs(b.h - a.h) <= 0.22 * a.h &&
        Math.abs((b.x0 + b.x1) / 2 - (a.x0 + a.x1) / 2) <= 5 * a.h);
      if (grp.length > best.length) best = grp;
    }
    if (best.length < 3 || best.length > 4) return null;
    best.sort((a, b) => a.x0 - b.x0);
    const g = readGlyphs(lab, w, best);
    if (g.some((r) => r.ch === "bolt" || r.score < 0.45)) return null;
    const s = g.map((r) => r.ch).join("");
    const hh = s.length === 3 ? s[0] : s.slice(0, 2), mm = s.slice(-2);
    if (+hh > 23 || +mm > 59) return null;
    return { hh, mm, score: g.reduce((a, r) => a + r.score, 0) / g.length };
  }

  function readBattery(d, W, sb, x0, x1) {
    const w = x1 - x0, h = sb, samp = [];
    for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 3) samp.push(lumOf(d, (y * W + x0 + x) * 4));
    const med = median(samp);
    const mask = new Uint8Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = (y * W + x0 + x) * 4;
      mask[y * w + x] = satOf(d, i) > 45 || Math.abs(lumOf(d, i) - med) > 32 ? 1 : 0;
    }
    const { comps } = components(mask, w, h);
    const bodies = comps.filter((c) => c.w >= 1.4 * c.h && c.h >= 0.12 * h && c.h <= 0.5 * h && c.n >= 0.4 * c.w * c.h);
    if (!bodies.length) return null;
    const body = bodies.reduce((a, b) => (b.x1 > a.x1 ? b : a));
    // trim the terminal nub on the right
    let bx1 = body.x1;
    while (bx1 > body.x0) {
      let n = 0; for (let y = body.y0; y <= body.y1; y++) if (mask[y * w + bx1]) n++;
      if (n >= 0.6 * body.h) break; bx1--;
    }
    const bx0 = body.x0, by0 = body.y0, by1 = body.y1, bw = bx1 - bx0 + 1, bh = by1 - by0 + 1;
    const px = (x, y) => (( (by0 + y) * W) + x0 + bx0 + x) * 4;

    // fill level from the colour run at the left of the battery
    const rowRuns = (yy) => {
      const runs = []; let cur = null, xa = 0, xb = bw - 1;
      const on = (x) => mask[(by0 + yy) * w + bx0 + x];
      while (xa < xb && !on(xa)) xa++;
      while (xb > xa && !on(xb)) xb--;
      for (let x = xa; x <= xb; x++) {
        const i = px(x, yy), col = [d[i], d[i + 1], d[i + 2]];
        if (cur && Math.hypot(col[0] - cur.c[0], col[1] - cur.c[1], col[2] - cur.c[2]) < 55) cur.len++;
        else { cur = { c: col, len: 1 }; runs.push(cur); }
      }
      return runs.filter((r) => r.len >= 2);
    };
    let fill = null, fillCol = null;
    const mid = rowRuns(Math.round(bh * 0.5));
    if (mid.length >= 3 && mid[0].len < 0.1 * bw && Math.abs(lumOf(mid[1].c, 0) - med) < 40) {
      const inner = bw - 2 * (mid[0].len + mid[1].len);
      if (inner > 0) { fill = Math.min(1, mid[2].len / inner); fillCol = mid[2].c; }
    } else {
      const r1 = rowRuns(Math.round(bh * 0.14)), r2 = rowRuns(Math.round(bh * 0.86));
      const f = (r) => (r.length ? r[0].len / r.reduce((a, b) => a + b.len, 0) : null);
      if (r1.length && r2.length) { fill = (f(r1) + f(r2)) / 2; fillCol = r1[0].c; }
    }
    const [R, G, B] = fillCol || [255, 255, 255];
    const charging = G > R + 40 && G > B + 30;
    const lowPower = R > 170 && G > 140 && B < 100;

    // percentage digits inside the battery
    let ocr = null;
    for (const kind of ["light", "dark"]) {
      const m = new Uint8Array(bw * bh);
      for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
        const i = px(x, y), l = lumOf(d, i);
        m[y * bw + x] = kind === "light" ? (l > 200 && satOf(d, i) < 50) : l < 50;
      }
      const { lab, comps: cs } = components(m, bw, bh);
      const glyphs = cs.filter((c) => c.x0 > 0 && c.y0 > 0 && c.x1 < bw - 1 && c.y1 < bh - 1 && c.h >= 0.4 * bh && c.w <= 1.1 * c.h)
        .sort((a, b) => a.x0 - b.x0);
      if (!glyphs.length || glyphs.length > 4) continue;
      const g = readGlyphs(lab, bw, glyphs).filter((r) => r.ch !== "bolt");
      if (!g.length || g.length > 3 || g.some((r) => r.score < 0.4)) continue;
      const val = +g.map((r) => r.ch).join("");

      const score = g.reduce((a, r) => a + r.score, 0) / g.length;
      if (!ocr || score > ocr.score) ocr = { val, score };

    const level = ocr ? ocr.val : fill != null ? Math.round(fill * 100) : null;

  }

  function analyze(img) {
    const [W, H] = sizeOf(img), sb = statusBarPx(img);
    const c = document.createElement("canvas"); c.width = W; c.height = sb;
    const g = c.getContext("2d", { willReadFrequently: true });
    g.drawImage(img, 0, 0);
    const d = g.getImageData(0, 0, W, sb).data;
    let time = null, battery = null;
    try { time = readTime(d, W, sb, 0, Math.round(W * 0.37)) || readTime(d, W, sb, Math.round(W * 0.33), Math.round(W * 0.67)); } catch (e) {}
    try { battery = readBattery(d, W, sb, Math.round(W * 0.6), W); } catch (e) {}

  }

  // ---------- fitting a phone screenshot into a window of another aspect ----------
  const rowCache = new WeakMap();
  function rowInfo(img, top) {
    const key = rowCache.get(img);
    if (key && key.top === top) return key.info;
    const [W, H] = sizeOf(img), Hc = H - top, CW = 128;
    const c = document.createElement("canvas"); c.width = CW; c.height = Hc;
    const g = c.getContext("2d", { willReadFrequently: true });
    g.drawImage(img, 0, top, W, Hc, 0, 0, CW, Hc);
    const d = g.getImageData(0, 0, CW, Hc).data;
    const flat = new Uint8Array(Hc), col = new Float32Array(Hc * 3);
    const ls = new Float32Array(CW - 6);
    for (let y = 0; y < Hc; y++) {
      let mn = 999, mx = -1, r = 0, gg = 0, b = 0;
      for (let x = 3; x < CW - 3; x++) {
        const i = (y * CW + x) * 4, l = lumOf(d, i);
        ls[x - 3] = l; if (l < mn) mn = l; if (l > mx) mx = l;
        r += d[i]; gg += d[i + 1]; b += d[i + 2];
      }
      const n = CW - 6;
      flat[y] = mx - mn <= 6 ? 1 : 0;
      const ml = median(ls);
      // row "background" colour = mean of pixels near the median brightness
      let cr = 0, cg = 0, cb = 0, cn = 0;
      for (let x = 3; x < CW - 3; x++) {
        const i = (y * CW + x) * 4;
        if (Math.abs(lumOf(d, i) - ml) <= 4) { cr += d[i]; cg += d[i + 1]; cb += d[i + 2]; cn++; }
      }
      col[y * 3] = cn ? cr / cn : r / n; col[y * 3 + 1] = cn ? cg / cn : gg / n; col[y * 3 + 2] = cn ? cb / cn : b / n;

    let last = base, miss = 0, y;
    for (y = base; y > limit; y--) {
      if (cdist(col, y, base) <= 8) { last = y; miss = 0; } else if (++miss >= 4) break;
    }
    return y > limit && last < Hc * 0.97 ? last : Math.round(Hc * 0.9);

  // returns a list of source row segments [{y, h, stretch}] whose total height ≈ need
  function planRows(img, top, need) {
    const info = rowInfo(img, top), { Hc, flat, col } = info;
    const R = Hc - need;
    if (Math.abs(R) < 2) return [{ y: 0, h: Hc }];
    if (R < 0) {
      const b = bottomBarTop(info);
      return [{ y: 0, h: b }, { y: b - 1, h: -R, stretch: true }, { y: b, h: Hc - b }];
    }
    const removed = new Uint8Array(Hc);
    let left = R;
    const lo = Math.round(Hc * 0.06), hi = Math.round(Hc * 0.93), runs = [];
    for (let y = lo; y < hi; ) {
      if (!flat[y]) { y++; continue; }
      let e = y + 1;
      while (e < hi && flat[e] && cdist(col, e, e - 1) <= 3) e++;
      const len = e - y, keep = Math.max(10, Math.round(len * 0.12));
      if (len - keep >= 6) runs.push({ s: y, len, take: len - keep });
      y = e;
    }
    runs.sort((a, b) => b.take - a.take);
    for (const r of runs) {
      if (left <= 0) break;
      const t = Math.min(r.take, left), s = r.s + Math.floor((r.len - t) / 2);
      for (let y = s; y < s + t; y++) removed[y] = 1;
      left -= t;
    }
    if (left > 0) {
      // cut one more band where the rows on both sides of the cut look alike, so the join is invisible
      const keep = [];
      for (let y = 0; y < Hc; y++) if (!removed[y]) keep.push(y);
      const { d, CW } = info, rowDiff = (a, b) => {
        let s = 0;
        for (let x = 0; x < CW; x++) {
          const i = (a * CW + x) * 4, j = (b * CW + x) * 4;
          s += Math.abs(d[i] - d[j]) + Math.abs(d[i + 1] - d[j + 1]) + Math.abs(d[i + 2] - d[j + 2]);
        }

      };

        if (c < bestC - 0.01) { bestC = c; bestI = i; }

  function roundRect(g, x, y, w, h, r) {

  }

  function paneColor(img, top) {
    const info = rowInfo(img, top), { Hc, flat, col } = info;
    // most common flat-row colour = the app's background
    const buckets = new Map();
    for (let y = 0; y < Hc; y++) if (flat[y]) {
      const k = [0, 1, 2].map((c) => Math.round(col[y * 3 + c] / 4) * 4).join(",");
      buckets.set(k, (buckets.get(k) || 0) + 1);

    for (const [k, v] of buckets) if (v > n) { n = v; best = k; }

    return `rgb(${c.map((v) => Math.max(0, Math.min(255, v + k))).join(",")})`;
  }

  // ---------- side status column ----------
  function drawStrip(g, x0, u, o) {
    const CX = x0 + L.CX * u;
    const rad = (a) => (a - 90) * Math.PI / 180;
    if (o.island) {
      const iw = L.ISL_W * u, ih = L.ISL_H * u, ix = CX - iw / 2, iy = L.ISL_TOP * u;
      roundRect(g, ix, iy, iw, ih, [iw / 2, iw / 2, iw / 2, iw / 2]);
      g.fillStyle = "#000"; g.fill();
      g.lineWidth = 0.22 * u; g.strokeStyle = "#232325"; g.stroke();
      const cs = L.CAM * u, cr = L.CAM_R * u;
      roundRect(g, CX - cs / 2, L.CAM_TOP * u, cs, cs, [cr, cr, cr, cr]);
      g.fillStyle = "#1b1b1d"; g.fill();
      g.fillStyle = "#4d4d50";
      for (let i = -2; i <= 2; i++) { g.beginPath(); g.arc(CX + i * L.GRILL_GAP * u, L.GRILL_Y * u, L.GRILL_R * u, 0, Math.PI * 2); g.fill(); }
    }
    const ty = (o.island ? L.TIME_Y_ISL : L.TIME_Y) * u, fs = L.FONT * u;
    g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "alphabetic";
    g.font = `600 ${fs}px -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif`;
    g.fillText(o.time, CX, ty + 0.355 * fs);

    const cy = ty + L.RING_DY * u, rm = L.RING_R * u, a0 = 180 + L.GAP, span = 360 - 2 * L.GAP;
    const lvl = Math.max(0, Math.min(100, o.battery)) / 100;
    const ringCol = o.charging ? "#30d158" : o.lowPower ? "#ffd60a" : lvl <= 0.2 ? "#ff453a" : "#ffffff";
    g.lineCap = "round"; g.lineWidth = L.RING_W * u;
    g.strokeStyle = "#424244"; g.beginPath(); g.arc(CX, cy, rm, rad(a0), rad(a0 + span)); g.stroke();
    if (lvl > 0) { g.strokeStyle = ringCol; g.beginPath(); g.arc(CX, cy, rm, rad(a0), rad(a0 + span * lvl)); g.stroke(); }
    [212, 190, 170, 148].forEach((a, i) => {
      const t = a * Math.PI / 180;
      g.fillStyle = i < o.signal ? "#fff" : "#3f3f41";
      g.beginPath(); g.arc(CX + L.DOT_R * u * Math.sin(t), cy - L.DOT_R * u * Math.cos(t), L.DOT * u, 0, Math.PI * 2); g.fill();
    });

      g.fillStyle = "#1c1c1e"; g.fill(); g.lineWidth = 0.15 * u; g.strokeStyle = "#3a3a3c"; g.stroke();
      g.beginPath(); g.moveTo(CX + 0.45 * u, by - 1.25 * u); g.lineTo(CX - 0.75 * u, by); g.lineTo(CX + 0.45 * u, by + 1.25 * u);
      g.lineWidth = 0.36 * u; g.lineJoin = "round"; g.strokeStyle = "#fff"; g.stroke();

  }

  function render(o) {

    const c = document.createElement("canvas"); c.width = CW; c.height = H;
    const g = c.getContext("2d");

    }
    drawStrip(g, areaW, u, o);
    return c;
  }

  return { analyze, render, statusBarPx };
})();

  }
  function seg(id, fn) {
    $(id).addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      $(id).querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      fn(b.dataset.v); render();
    });
  }
  seg("mode", (v) => { st.open = v === "open"; $("layoutRow").hidden = !st.open; });
  seg("layout", (v) => { st.layout = v; $("pick2").hidden = v !== "split"; });
  seg("signal", (v) => { st.signal = +v; });
  seg("crop", (v) => { st.crop = v === "1"; });

  // save
  let downloads = null;
  try { if (window.claude && window.claude.use) window.claude.use("downloads").then((d) => { downloads = d; }).catch(() => {}); } catch (e) {}
  $("save").addEventListener("click", async () => {
    if (!lastBlob) return;
    const fname = `${st.name}-duo-${st.open ? "open" : "fold"}.png`;
    if (downloads) {
      try { await downloads.save({ filename: fname, data: lastBlob }); $("msg").textContent = "已交给系统保存"; }
      catch (err) { $("msg").textContent = err && err.code === "declined" ? "已取消保存" : "保存没成功，长按预览图选「存储图像」"; }
      return;
    }
    const file = new File([lastBlob], fname, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); $("msg").textContent = "在分享面板里选「存储图像」就进相册了"; return; }
      catch (err) { if (err && err.name === "AbortError") { $("msg").textContent = "已取消"; return; } }
    }
    const a = document.createElement("a"); a.href = lastUrl; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    $("msg").textContent = "已下载；没反应的话长按预览图选「存储图像」";
  });

  window.__duo = { Duo, st, render, applyDetect };
  const sample = makeSample();
  st.img = sample;
  applyDetect(sample, null);
  render();
})();
</script>
</body>
</html>
